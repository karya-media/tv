[project]
name = "iptv-playlist-manager"
version = "0.1.0"
description = "IPTV Playlist Management & Validation System"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiohttp>=3.10",
    "httpx>=0.27",
    "lxml>=5.3",
    "typer>=0.12",          # CLI framework for interfaces/cli
    "python-dotenv>=1.0",
    "openpyxl>=3.1",        # Excel report generation (Phase 4)
    "jinja2>=3.1",          # HTML report templating (Phase 4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "aioresponses>=0.7",   # mocking aiohttp in tests
]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
]

[project.scripts]
iptv-manager = "iptv_manager.interfaces.cli.main:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=iptv_manager --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["iptv_manager"]
