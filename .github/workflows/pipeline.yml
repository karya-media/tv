name: IPTV Playlist Pipeline

# Runs the full pipeline: merge every category playlist, validate
# streams, validate logos, generate reports, then commit the results
# back to the repository. Because data/master/master.m3u and
# docs/master.m3u are committed to `main`, the public playlist URLs
# (raw.githubusercontent.com and GitHub Pages) update automatically -
# no separate "deploy" step is needed.

on:
  push:
    branches: [main]
    paths:
      - "data/categories/**"
      - "data/sources.txt"
      - "data/channel_order.txt"
  schedule:
    # Every 6h: re-sync every URL listed in data/sources.txt (so
    # category files derived from a remote source stay up to date
    # automatically), then merge + re-validate + report as usual.
    # Category files NOT listed in data/sources.txt (manually curated
    # ones) are never touched by this step.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

permissions:
  contents: write # required to commit the updated playlist/reports back

concurrency:
  group: iptv-pipeline-${{ github.ref }}
  # Queue instead of killing an in-progress run: this pipeline now
  # does real, potentially slow work (validating thousands of streams,
  # fetching a large EPG file) - cancelling it mid-way wastes that work
  # and surfaces as a confusing "Error: The operation was canceled."
  # rather than a real failure. A scheduled run and a manual "Run
  # workflow" click share this same group (both trigger on the same
  # ref), so this also protects against accidentally cancelling one by
  # triggering the other while it's still running.
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg (provides ffprobe)
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint, type-check, and test before touching main
        run: |
          ruff check src tests
          mypy src
          pytest

      - name: Sync auto-updating sources (data/sources.txt)
        run: |
          iptv-manager sync-sources

      - name: Run pipeline (merge, validate, logos, report)
        id: pipeline
        env:
          # Public XMLTV URL - not a secret, so it lives here directly
          # rather than in GitHub Secrets. Written into master.m3u's
          # "#EXTM3U url-tvg=..." header so players auto-load a guide.
          #
          # Deliberately NOT passed to `report --epg`: the tvg-id
          # matching feature is fully implemented and tested (see
          # MatchTvgIdFromEpgUseCase / `iptv-manager check-epg`), but
          # this specific aggregated source is large enough that
          # fetching+parsing it here reliably killed the job (OOM /
          # cancelled, even after streaming-friendly bytes parsing).
          # Run it manually with a smaller/more targeted XMLTV source
          # instead: `iptv-manager report --epg <url-or-path>`.
          IPTV_EPG_URL: "https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz"
        run: |
          iptv-manager report --formats html,json,csv,xlsx

      - name: Commit and push updated playlist/reports
        run: |
          git config user.name "iptv-playlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/categories data/master docs reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automated playlist merge, validation, and report [skip ci]"
            # main can move between this job's checkout and this push
            # (e.g. a PR merging concurrently) - retry with a rebase
            # instead of failing the whole run over a race condition.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/5) - pulling and retrying..."
              git pull --rebase origin main
              if [ "$attempt" = "5" ]; then
                echo "::error::Failed to push after 5 attempts."
                exit 1
              fi
            done
          fi

      - name: Upload reports as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          retention-days: 30
