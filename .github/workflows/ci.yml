name: CI

# Lints, type-checks, and tests every change to the application code.
# Unlike pipeline.yml (which only runs on data/** changes and commits
# the merged playlist back to main), this workflow guards src/ and
# tests/ so a broken change can never reach main unnoticed.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg (provides ffprobe, needed by the test suite)
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install project (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest
